name: Weekly data pipeline

# docs/DESIGN.md section 14: "scheduled weekly pipeline job" -- refreshes player
# stats, prices and documents against the production database. Authored, never run:
# real Transfermarkt ingestion exists now (pipeline/real_source.py, docs/DECISIONS.md
# "real data integration"), and DATA_SOURCE defaults to "real" as of this phase, so
# this just needs the dataset downloaded first and a reachable production
# DATABASE_URL secret, which doesn't exist yet (no deployment, by instruction).

on:
  schedule:
    - cron: "0 4 * * 1" # Monday 04:00 UTC
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m pipeline.download_real_data
      - run: python -m pipeline.run_all
