name: CI

# docs/DESIGN.md section 12's CI gate: lint, typecheck, tests, Playwright E2E, eval
# subset with a pinned model; fails on numeric-correctness/Recall@10 thresholds
# (evals/run_all.py's own exit code -- see its docstring for exactly what trips it).
#
# Runs against SQLite, not Postgres: docs/DECISIONS.md explains that this whole
# project was built without a reachable Postgres (Docker Desktop's engine wouldn't
# start in that sandbox), so the Postgres path in db/migrations/ has never been
# exercised live, including here. Swapping this job's DATABASE_URL to a
# `services: postgres:` block pointed at `pgvector/pgvector:pg16` plus a
# `make migrate` step is the one thing to do before trusting this gate for the real
# target database.
#
# No job here needs a secret: LLM_PROVIDER is always "stub", and DATA_SOURCE is
# always "synthetic" (the 241MB real dataset is never downloaded in CI -- every job
# below sets this explicitly, since docs/DECISIONS.md "Synthetic data is no longer
# the silent default" means nothing may rely on DATA_SOURCE's "real" default here).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+aiosqlite:///./ci.db"
      LLM_PROVIDER: stub
      DATA_SOURCE: synthetic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,eval]"

      - name: Lint
        run: ruff check .

      - name: Typecheck (strict on engine/rag/llm)
        run: mypy engine rag llm

      - name: Typecheck (pipeline/graph/db/config/api/evals/observability)
        run: mypy pipeline graph db config api evals observability.py

      - name: Unit + integration tests
        run: pytest -q

      - name: Seed the eval database
        run: python -m pipeline.run_all

      - name: Run eval subset (numeric correctness, faithfulness; retrieval if a golden set exists)
        run: python -m evals.run_all

      - name: Upload eval baseline (this run's numbers, not the committed one)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-baseline
          path: evals/baselines/baseline.json

  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+aiosqlite:///./ci.db"
      LLM_PROVIDER: stub
      DATA_SOURCE: synthetic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e .

      - name: Seed the database
        run: python -m pipeline.run_all

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright's browser (chromium only -- that's all the specs use)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start API + frontend dev server, wait for both, run Playwright
        working-directory: frontend
        run: |
          (cd .. && nohup uvicorn api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &)
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > vite.log 2>&1 &

          for url in "http://127.0.0.1:8000/health" "http://127.0.0.1:5173/"; do
            ready=0
            for _ in $(seq 1 30); do
              curl -fs "$url" -o /dev/null && { ready=1; break; }
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Timed out waiting for $url" >&2
              cat ../api.log vite.log 2>/dev/null
              exit 1
            fi
          done

          npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
