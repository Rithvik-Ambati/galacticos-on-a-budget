name: Nightly full eval

# docs/DESIGN.md section 12: "Full eval runs nightly." Same eval subset as ci.yml,
# plus the embedding-model benchmark (evals/embedding_benchmark.py -- not run on
# every PR since it downloads and encodes with 3 separate models).
#
# Faithfulness gate: nightly has no secret to call a live LLM with (same "no job
# here needs a secret" rule as ci.yml), so it can't compute a fresh live
# faithfulness score. evals/check_faithfulness_gate.py instead checks the STATIC,
# human-committed record at evals/baselines/live_faithfulness_baseline.json --
# written by running `python -m evals.faithfulness_eval` by hand with
# LLM_PROVIDER=anthropic set. The gate "activates only when a live-run baseline
# exists": if that file was never committed, the check passes trivially. See
# docs/PROGRESS.md Part 4 for how to exercise a failing gate on a throwaway branch.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  nightly-eval:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+aiosqlite:///./nightly.db"
      LLM_PROVIDER: stub
      DATA_SOURCE: synthetic  # see ci.yml's comment -- no data_raw/ download in CI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,eval]"

      - name: Seed the eval database
        run: python -m pipeline.run_all

      - name: Run full eval suite (numeric, retrieval, faithfulness)
        run: python -m evals.run_all

      - name: Run embedding-model benchmark
        run: python -m evals.embedding_benchmark

      - name: Faithfulness gate (checks a committed live-run baseline, if any)
        run: python -m evals.check_faithfulness_gate

      - name: Upload eval baseline (this run's numbers, not the committed one)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-baseline
          path: evals/baselines/baseline.json
