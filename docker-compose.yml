services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gaffer
      POSTGRES_PASSWORD: gaffer
      POSTGRES_DB: gaffer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaffer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://gaffer:gaffer@postgres:5432/gaffer
      NEXTAUTH_SECRET: dev-secret-change-me
      SALT: dev-salt-change-me
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
