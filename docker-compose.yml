# Dev-only credentials throughout this file (clearly non-production, matching the
# project's existing "gaffer"/"dev-secret-change-me" style placeholders) -- see
# docker-compose.prod.yml for the real-secrets-required production composition.
#
# Two independent stacks live here: the app's own Postgres+pgvector/Redis (used by
# config.settings.DATABASE_URL/REDIS_URL), and a full Langfuse v4 self-host (its own
# Postgres, Redis, ClickHouse and MinIO -- Langfuse's own metadata/trace storage,
# unrelated to the app's database). docs/DECISIONS.md "Langfuse v4 self-host
# replaces the v2 image" explains why: the installed langfuse Python SDK (4.x) is
# OTEL/OTLP-based and only ingests into a v3+ server; the old single-container
# `langfuse/langfuse:2` image predates that and silently can't receive traces from
# this SDK at all.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gaffer
      POSTGRES_PASSWORD: gaffer
      POSTGRES_DB: gaffer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaffer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -- Langfuse v4 self-host (its own Postgres/Redis/ClickHouse/MinIO; official
  # compose at https://github.com/langfuse/langfuse, ports remapped below to avoid
  # colliding with the app's own `postgres`/`redis` above on 5432/6379) --

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &langfuse-worker-env
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      SALT: dev-salt-change-me
      ENCRYPTION_KEY: "590da45d352d9b4ddc16e06abf40c68d848bb2237acf60a1358298e0fd0b0892"
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: dev-redis-secret-change-me
      REDIS_TLS_ENABLED: "false"

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: dev-secret-change-me
      # Next.js's standalone server binds to $HOSTNAME if it's set, which Docker
      # defaults to the container id -- resolves to the container's own network
      # IP, not "listen on every interface", so a loopback healthcheck inside
      # the container (and the host port-publish path, which is NAT, not
      # loopback) can't reach it without this override.
      HOSTNAME: "0.0.0.0"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      # Auto-provisions one org/project/API-key pair on first boot, so a fresh
      # `docker compose up -d` is immediately usable from .env's LANGFUSE_*
      # vars without a manual sign-up step -- dev-only values, same spirit as
      # every other CHANGEME default in this file.
      LANGFUSE_INIT_ORG_ID: dev-org
      LANGFUSE_INIT_ORG_NAME: Gaffer Dev
      LANGFUSE_INIT_PROJECT_ID: gaffer-dev
      LANGFUSE_INIT_PROJECT_NAME: Gaffer
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-gaffer-dev-0000000000000000
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-gaffer-dev-0000000000000000
      LANGFUSE_INIT_USER_EMAIL: dev@example.com
      LANGFUSE_INIT_USER_NAME: Gaffer Dev
      LANGFUSE_INIT_USER_PASSWORD: dev-password-change-me
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/public/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9090:9000"
      - "9091:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      --requirepass dev-redis-secret-change-me
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-postgres:
    image: postgres:17
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

volumes:
  pgdata:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
