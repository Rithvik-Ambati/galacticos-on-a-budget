[project]
name = "lineup-lab"
version = "0.1.0"
description = "Build an XI to beat an assigned real-world opponent."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pgvector>=0.3",
  "redis>=5.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "xgboost>=2.0",
  "scikit-learn>=1.5",
  "shap>=0.46",
  "scipy>=1.13",
  "numpy>=1.26",
  "pandas>=2.2",
  "ortools>=9.10",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langfuse>=2.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]
eval = [
  "ragas>=0.2",
  "deepeval>=1.0",
]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["engine.*", "rag.*", "llm.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "engine*", "rag*", "llm*", "graph*", "api*", "config*"]
